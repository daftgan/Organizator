# Organizator pour Windows : exe autonome (runtime .NET embarque) et installateur Inno Setup.
#
# - A chaque push ou pull request qui touche l'application : construction, et les deux fichiers en
#   artefact du run (onglet Actions › le run › Artifacts).
# - Sur un tag v* (git tag v1.2.0 && git push origin v1.2.0) : en plus, une Release GitHub avec
#   Organizator-Setup-<version>.exe (a telecharger et lancer, sans droits d'administrateur) et
#   l'exe portable.
# - Sans git : Actions › Organizator › Run workflow, avec une version (1.2.0) : le runner cree le tag
#   v1.2.0 sur le commit construit, puis la meme Release.
name: Organizator

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths:
      - 'src/Organizator/**'
      - 'installer/**'
      - '.github/workflows/organizator.yml'
  pull_request:
    paths:
      - 'src/Organizator/**'
      - 'installer/**'
      - '.github/workflows/organizator.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version a publier (ex. 1.2.0) : cree le tag v<version> et la Release. Vide : simple construction.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: organizator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Version
        id: version
        shell: pwsh
        run: |
          $release = ''
          $wanted = '${{ inputs.version }}'.Trim() -replace '^v', ''
          if ('${{ github.ref_type }}' -eq 'tag' -and '${{ github.ref_name }}' -match '^v(\d+\.\d+\.\d+)(-.+)?$') {
            $numeric = $Matches[1]
            $version = '${{ github.ref_name }}'.Substring(1)
            $release = '${{ github.ref_name }}'
          } elseif ($wanted) {
            if ($wanted -notmatch '^(\d+\.\d+\.\d+)(-[0-9A-Za-z.-]+)?$') { throw "Version illisible : $wanted (attendu : 1.2.0)" }
            $numeric = $Matches[1]
            $version = $wanted
            $release = "v$wanted"
          } else {
            $numeric = '1.0.0'
            $version = "1.0.0-ci.${{ github.run_number }}"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "numeric=$numeric" >> $env:GITHUB_OUTPUT
          "release=$release" >> $env:GITHUB_OUTPUT

      # Meme publication que publish.ps1 -SelfContained, par la CLI dotnet (MSBuild 18 n'est pas sur les runners).
      - name: Publier l'exe autonome
        shell: pwsh
        run: |
          dotnet publish src/Organizator/Organizator.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true `
            -p:Version=${{ steps.version.outputs.version }} `
            -p:FileVersion=${{ steps.version.outputs.numeric }}.0 -p:AssemblyVersion=${{ steps.version.outputs.numeric }}.0 `
            -o publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem publish | Select-Object Name, Length | Format-Table -AutoSize

      - name: Construire l'installateur
        shell: pwsh
        run: |
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --no-progress -y | Out-Null
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" "/DPublishDir=$PWD\publish" installer\Organizator.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item publish\Organizator.exe "publish\installer\Organizator-${{ steps.version.outputs.version }}-portable.exe"
          Get-ChildItem publish\installer | Select-Object Name, Length | Format-Table -AutoSize

      - uses: actions/upload-artifact@v4
        with:
          name: Organizator-${{ steps.version.outputs.version }}
          path: publish/installer/*.exe
          if-no-files-found: error

      # Tag pousse : la Release se cree sur ce tag. Lancement a la main avec une version : gh cree aussi le
      # tag, sur le commit construit. Release deja la (creee a la main) : les fichiers y sont ajoutes.
      - name: Release
        if: steps.version.outputs.release != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.version.outputs.release }}'
          $files = (Get-ChildItem publish\installer\*.exe).FullName
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $files --clobber
          } else {
            gh release create $tag $files --target '${{ github.sha }}' `
              --title 'Organizator ${{ steps.version.outputs.version }}' --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
